name: ClaudeSessions
options:
  bundleIdPrefix: dev.local
  deploymentTarget:
    macOS: "14.0"
settings:
  CODE_SIGN_IDENTITY: "-"
  CODE_SIGN_STYLE: Manual
  DEVELOPMENT_TEAM: ""
  ENABLE_HARDENED_RUNTIME: NO
  SWIFT_VERSION: "5.9"
  MARKETING_VERSION: "1.0"
  CURRENT_PROJECT_VERSION: "1"

targets:
  ClaudeSessions:
    type: application
    platform: macOS
    sources: [Sources/Shared, Sources/App]
    dependencies:
      - target: ClaudeSessionsWidget
        embed: true
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleName: Claude Sessions
        LSUIElement: true          # menu bar only, no dock icon
        CFBundleURLTypes:
          - CFBundleURLName: dev.local.ClaudeSessions
            CFBundleURLSchemes: [claudesessions]

  ClaudeSessionsWidget:
    type: app-extension
    platform: macOS
    sources: [Sources/Shared, Sources/Widget]
    entitlements:
      path: Sources/Widget/Widget.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: dev.local.ClaudeSessions.Widget
    info:
      path: Sources/Widget/Info.plist
      properties:
        CFBundleDisplayName: Claude Sessions
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
